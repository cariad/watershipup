name: release

on:
  release:
    types:
      - published

permissions: {}

env:
  MISE_LOCKED: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the release's tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is main's latest commit
        run: |
          if [[ $(git rev-parse HEAD) != $(git rev-parse origin/main) ]]; then
            echo "::error::$GITHUB_REF_NAME isn't main's latest commit."
            exit 1
          fi

      - name: Install mise and uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          install_args: uv  # Only uv, not the linters
          version: 2026.10.11

      # uv.lock doesn't lock the build's own tools, such as hatchling, so hold them to
      # releases at least 7 days old, like everything else here.
      - name: Build the package with the tag's version
        run: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_WATERSHIPUP="${GITHUB_REF_NAME#v}" uv build --exclude-newer "7 days"

      - name: Check that the package has the tag's version
        run: |
          ls dist
          test -f "dist/watershipup-${GITHUB_REF_NAME#v}.tar.gz"

      # This doesn't use uv.lock either, so hold the wheel's dependencies to releases at
      # least 7 days old too.
      - name: Run the built wheel's command
        run: uv run --exclude-newer "7 days" --isolated --no-project --with dist/*.whl watershipup --version

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: dist
          path: dist/

  publish:
    environment:
      name: pypi
      url: https://pypi.org/p/watershipup

    needs: build

    permissions:
      id-token: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
