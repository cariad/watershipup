[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.0",
]

[project]
authors = [{ name = "Cariad Eccleston", email = "cariad@cariad.earth" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "mosey>=0.5.0,<0.6",
]
description = "Uploads static websites to Bunny Storage zones"
dynamic = ["version"]
license = "MIT"
name = "watershipup"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
watershipup = "watershipup.cli:main"

[project.urls]
Issues = "https://github.com/cariad/watershipup/issues"
Source = "https://github.com/cariad/watershipup"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["watershipup"]

[tool.hatch.version]
fallback-version = "0.0.0"
source = "vcs"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov"
testpaths = [
  "tests/unit",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "ANN",    # Require all type annotations
  "B",      # flake8-bugbear
  "D",      # pydocstyle
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "G",      # flake8-logging-format
  "I",      # isort
  "LOG",    # flake8-logging
  "RUF",    # ruff's own rules
  "SIM",    # flake8-simplify
  "UP",     # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
required-version = ">=0.12.19, <0.13"
